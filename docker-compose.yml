version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CampusCrate — Docker Compose
#
# Usage:
#   docker compose up --build          # first run / after code changes
#   docker compose up                  # subsequent runs
#
# To expose on your local network (any device on the same WiFi):
#   docker compose up --build and share http://<your-machine-ip>:3000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Django Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campuscrate-backend
    container_name: campuscrate-backend
    env_file:
      - ./backend/.env
    environment:
      # Override for Docker networking — frontend calls backend at this host
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
    ports:
      - "8000:8000"
    networks:
      - campuscrate-net
    restart: unless-stopped
    # Health check: wait until Django is actually serving requests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend URL the BROWSER will call (must be accessible from user's machine)
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    image: campuscrate-frontend
    container_name: campuscrate-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - campuscrate-net
    restart: unless-stopped

networks:
  campuscrate-net:
    driver: bridge
